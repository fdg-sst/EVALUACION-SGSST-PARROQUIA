<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Evaluación SGSST · Inducción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#12303F;
    --navy-deep:#0B222D;
    --safety-green:#1F7A5C;
    --safety-green-dark:#155C45;
    --safety-yellow:#F4B400;
    --paper:#F5F7F6;
    --card:#FFFFFF;
    --ink:#16262D;
    --ink-soft:#5B6E75;
    --line:#DCE4E2;
    --danger:#C0392B;
    --danger-bg:#FBEAE8;
    --ok-bg:#E7F4EE;
    --radius:14px;
    --shadow: 0 4px 18px rgba(18,48,63,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',system-ui,sans-serif;
    letter-spacing:-0.01em;
    color:var(--navy-deep);
  }
  #app{
    max-width:760px;
    margin:0 auto;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .topbar .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
  }
  .badge-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--safety-yellow);
    flex-shrink:0;
  }
  .topbar button{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    padding:7px 13px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Manrope',sans-serif;
  }
  .topbar button:hover{background:rgba(255,255,255,0.22);}
  .content{padding:26px 20px 10px;}
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    padding:26px;
    margin-bottom:18px;
  }
  .eyebrow{
    text-transform:uppercase;
    font-size:11.5px;
    font-weight:800;
    letter-spacing:0.09em;
    color:var(--safety-green-dark);
    margin:0 0 8px;
  }
  h1.title{font-size:26px;margin:0 0 10px;line-height:1.2;}
  h2.section-title{font-size:19px;margin:0 0 14px;}
  p.lead{color:var(--ink-soft);font-size:15px;margin:0 0 18px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 20px;
    border-radius:10px;
    font-weight:700;
    font-size:14.5px;
    border:none;
    cursor:pointer;
    font-family:'Manrope',sans-serif;
    transition:transform .06s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--safety-green);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--safety-green-dark);}
  .btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--line);width:100%;}
  .btn-secondary:hover{border-color:var(--navy);}
  .btn-video{background:var(--navy);color:#fff;width:100%;}
  .btn-video:hover{background:var(--navy-deep);}
  .btn-small{padding:8px 14px;font-size:13px;width:auto;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 6px;
  }
  input[type=text], input[type=password], input[type=number], select, textarea{
    width:100%;
    padding:12px 13px;
    border-radius:9px;
    border:1.5px solid var(--line);
    font-size:15px;
    font-family:'Manrope',sans-serif;
    color:var(--ink);
    background:#fff;
    margin-bottom:16px;
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--safety-green);
  }
  .field-error{border-color:var(--danger) !important;}
  .error-text{color:var(--danger);font-size:12.5px;margin:-12px 0 14px;font-weight:600;}
  .q-block{
    padding:18px 0;
    border-top:1px solid var(--line);
  }
  .q-block:first-child{border-top:none;padding-top:0;}
  .q-num{
    display:inline-block;
    background:var(--navy);
    color:#fff;
    font-size:11.5px;
    font-weight:800;
    padding:3px 9px;
    border-radius:6px;
    margin-bottom:10px;
  }
  .q-text{font-weight:700;font-size:15.5px;margin-bottom:12px;color:var(--navy-deep);}
  .opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:11px 13px;
    border:1.5px solid var(--line);
    border-radius:9px;
    margin-bottom:8px;
    cursor:pointer;
    font-size:14.5px;
  }
  .opt:hover{border-color:var(--safety-green);}
  .opt.selected{border-color:var(--safety-green);background:var(--ok-bg);}
  .opt input{margin:2px 0 0;width:auto;flex-shrink:0;}
  .match-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .match-label{
    flex:1 1 220px;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:11px 13px;
    font-weight:700;
    font-size:14px;
    color:var(--navy-deep);
  }
  .match-select{flex:1 1 220px;margin:0;}
  .progress-wrap{margin-bottom:22px;}
  .progress-bar{
    height:7px;
    background:var(--line);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--safety-green);
    border-radius:99px;
    transition:width .25s ease;
  }
  .progress-text{font-size:12px;color:var(--ink-soft);margin-top:6px;font-weight:600;}
  .score-hero{
    text-align:center;
    padding:8px 0 20px;
  }
  .score-num{
    font-family:'Space Grotesk',sans-serif;
    font-size:56px;
    font-weight:700;
    line-height:1;
    color:var(--navy-deep);
  }
  .score-label{color:var(--ink-soft);font-size:13.5px;font-weight:600;margin-top:6px;}
  .pill{
    display:inline-block;
    padding:6px 16px;
    border-radius:99px;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.02em;
    margin-top:14px;
  }
  .pill-ok{background:var(--ok-bg);color:var(--safety-green-dark);}
  .pill-bad{background:var(--danger-bg);color:var(--danger);}
  .info-box{
    background:var(--paper);
    border-left:3px solid var(--safety-green);
    padding:13px 15px;
    border-radius:8px;
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .warn-box{
    background:var(--danger-bg);
    border-left:3px solid var(--danger);
    padding:13px 15px;
    border-radius:8px;
    font-size:13.5px;
    color:#7B241C;
    margin-bottom:16px;
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    padding:9px 8px;
    border-bottom:2px solid var(--line);
    white-space:nowrap;
  }
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .table-scroll{overflow-x:auto;margin:0 -26px;padding:0 26px;}
  .status-chip{
    display:inline-block;
    padding:3px 10px;
    border-radius:99px;
    font-size:11px;
    font-weight:800;
  }
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  .stat-card{
    background:var(--paper);
    border-radius:10px;
    padding:14px 16px;
    border:1px solid var(--line);
  }
  .stat-num{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:var(--navy-deep);}
  .stat-label{font-size:11.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
  .tab-bar{display:flex;gap:6px;margin-bottom:20px;border-bottom:1.5px solid var(--line);}
  .tab-btn{
    background:none;border:none;padding:10px 4px;margin-right:16px;
    font-family:'Manrope',sans-serif;font-weight:700;font-size:13.5px;
    color:var(--ink-soft);cursor:pointer;border-bottom:2.5px solid transparent;
    margin-bottom:-1.5px;
  }
  .tab-btn.active{color:var(--navy-deep);border-bottom-color:var(--safety-green);}
  .search-input{margin-bottom:14px;}
  .foot-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:18px;}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  .link-btn{
    background:none;border:none;color:var(--safety-green-dark);
    font-weight:700;font-size:13px;cursor:pointer;padding:0;text-decoration:underline;
  }
  .spinner{
    width:18px;height:18px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.35);
    border-top-color:#fff;
    animation:spin .7s linear infinite;
    display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .detail-row{background:var(--paper);}
  .detail-q{padding:10px 0;border-top:1px dashed var(--line);font-size:13px;}
  .detail-q:first-child{border-top:none;}
  .tag-correct{color:var(--safety-green-dark);font-weight:700;}
  .tag-wrong{color:var(--danger);font-weight:700;}
  #printCard{
    position:fixed;
    left:-9999px;
    top:0;
    width:650px;
    background:#fff;
    padding:36px;
    font-family:'Manrope',sans-serif;
  }
  @media (max-width:480px){
    .content{padding:20px 14px 10px;}
    .card{padding:20px;}
    .score-num{font-size:46px;}
    .stat-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="printCard"></div>

<script>
/* ===================== CONTENIDO DEL EXAMEN ===================== */
/* Basado literalmente en las diapositivas de la inducción SGSST */

const QUESTIONS = [
  {
    id:"q1",
    text:"¿Qué es el SGSST?",
    options:[
      "Un grupo de trabajadores encargado únicamente de firmar documentos",
      "Un proceso lógico y por pasos que busca anticipar, reconocer, evaluar y controlar los riesgos y peligros que pueden afectar la seguridad y salud en el trabajo",
      "Un examen médico obligatorio una vez al año",
      "Un reglamento exclusivo para el área administrativa de la parroquia"
    ],
    correct:1
  },
  {
    id:"q2",
    text:"¿Cuál de las siguientes NO es un objetivo del SGSST?",
    options:[
      "Identificar y controlar peligros y riesgos",
      "Proteger el bienestar físico y mental de cada colaborador",
      "Aumentar la producción sin importar la seguridad de las personas",
      "Fomentar una cultura de prevención entre todos"
    ],
    correct:2
  },
  {
    id:"q3",
    text:"¿Qué es un peligro?",
    options:[
      "Toda fuente, situación o acto que puede causar lesión, accidente o enfermedad a las personas, o daño a equipos e instalaciones",
      "La probabilidad de que algo malo ocurra",
      "Un accidente que ya sucedió",
      "Un elemento de protección personal"
    ],
    correct:0
  },
  {
    id:"q4",
    text:"¿Qué es un riesgo?",
    options:[
      "Un objeto que puede causar daño",
      "La probabilidad de que un peligro se materialice y cause consecuencias negativas",
      "Un reporte que se llena después de un incidente",
      "Una norma que deben cumplir los trabajadores"
    ],
    correct:1
  },
  {
    id:"q5",
    text:"Transitar en moto sin casco es un ejemplo de:",
    options:[
      "Cumplimiento de las normas de seguridad",
      "Un acto inseguro: hacer una tarea de forma incorrecta o sin las precauciones necesarias, poniendo en riesgo la seguridad propia o de otros",
      "Un reporte oportuno de peligro",
      "El uso correcto de los elementos de protección personal"
    ],
    correct:1
  },
  {
    id:"q6",
    text:"Resbalar en un piso húmedo, pero sin llegar a caer, es un ejemplo de:",
    options:[
      "Accidente de trabajo",
      "Enfermedad laboral",
      "Incidente de trabajo: un evento inesperado que pudo causar daño, pero no llegó a hacerlo",
      "Acto inseguro sin consecuencias"
    ],
    correct:2
  },
  {
    id:"q7",
    text:"¿Qué es una enfermedad laboral?",
    options:[
      "Cualquier enfermedad que tenga un trabajador, sin importar la causa",
      "La que se produce como resultado directo de las condiciones del trabajo o la exposición a factores de riesgo del ambiente laboral",
      "Un accidente ocurrido camino al trabajo",
      "Un incidente que fue reportado a tiempo"
    ],
    correct:1
  },
  {
    id:"q8",
    text:"¿Cuál de las siguientes opciones NO es un Elemento de Protección Personal (EPP)?",
    options:[
      "Mascarilla o tapabocas",
      "Guantes",
      "Overol o delantal",
      "Una extensión eléctrica rota"
    ],
    correct:3
  },
  {
    id:"q9",
    text:"¿Cuál de las siguientes es un ejemplo de emergencia o amenaza mencionado en la inducción?",
    options:[
      "Una reunión de planeación semanal",
      "Un incendio",
      "Una pausa activa",
      "Una capacitación programada"
    ],
    correct:1
  },
  {
    id:"q10",
    text:"¿Cuál de las siguientes NO es una buena práctica o medida preventiva recomendada?",
    options:[
      "Reportar peligros e incidentes oportunamente",
      "Usar correctamente los elementos de protección personal (EPP)",
      "Mantener el área de trabajo limpia y ordenada",
      "Ocultar un accidente para evitar generar reportes"
    ],
    correct:3
  }
];

const MATCH_PAIRS = [
  {id:"m1", peligro:"Peligro físico (ruido, temperaturas extremas)", riesgo:"Pérdida auditiva o lesiones por calor/frío"},
  {id:"m2", peligro:"Peligro biológico (virus, bacterias)", riesgo:"Infecciones o enfermedades contagiosas"},
  {id:"m3", peligro:"Peligro químico (sustancias de limpieza)", riesgo:"Intoxicación o quemaduras químicas"},
  {id:"m4", peligro:"Peligro locativo (pisos, escaleras, orden y aseo)", riesgo:"Caídas o golpes"}
];

const TOTAL_POINTS = QUESTIONS.length + MATCH_PAIRS.length; // 14
const ADMIN_PASSWORD = "SGSST2026";
const CONFIG_KEY = "sgsst_config_v1";
const SUB_PREFIX = "sgsst_sub_";

/* ===================== ESTADO ===================== */
function currentYear(){ return String(new Date().getFullYear()); }

let state = {
  view:"landing", // landing, form, quiz, blocked, result, admin_login, admin
  worker:{nombres:"", cedula:"", cargo:"", parroquia:"", consent:false},
  formErrors:{},
  answers:{}, // qid -> optionIndex
  matchAnswers:{}, // matchId -> riesgoId chosen
  quizErrors:[],
  config:{videoUrl:"", passPercent:70, roster:"", cycleId:currentYear(), cutoffDate:""},
  configLoaded:false,
  submitting:false,
  blockedRecord:null,
  resultRecord:null,
  admin:{loggedIn:false, pwd:"", pwdError:false, records:[], loadingRecords:false, tab:"resumen", search:"", editVideoUrl:"", editPassPercent:70, editRoster:"", editCycleId:"", editCutoffDate:"", savingConfig:false, expandedRow:null, resetCedula:""}
};

function sanitizeKey(v){
  return String(v||"").trim().replace(/[\s\/\\'"]/g,"");
}
function buildSubKey(cedula, cycleId){
  return SUB_PREFIX + sanitizeKey(cedula) + "_" + sanitizeKey(cycleId || state.config.cycleId || currentYear());
}
function shuffled(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
const RIESGO_OPTIONS_SHUFFLED = shuffled(MATCH_PAIRS.map(p=>({id:p.id, riesgo:p.riesgo})));

/* ===================== STORAGE HELPERS ===================== */
async function loadConfig(){
  try{
    const res = await window.storage.get(CONFIG_KEY, true);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state.config = Object.assign({videoUrl:"", passPercent:70, roster:"", cycleId:currentYear(), cutoffDate:""}, parsed);
    }
  }catch(e){
    // no existe todavía, se queda con default
  }
  state.configLoaded = true;
  state.admin.editVideoUrl = state.config.videoUrl;
  state.admin.editPassPercent = state.config.passPercent;
  state.admin.editRoster = state.config.roster;
  state.admin.editCycleId = state.config.cycleId;
  state.admin.editCutoffDate = state.config.cutoffDate;
}

async function saveConfig(newConfig){
  state.admin.savingConfig = true;
  render();
  try{
    await window.storage.set(CONFIG_KEY, JSON.stringify(newConfig), true);
    state.config = newConfig;
  }catch(e){
    alert("No se pudo guardar la configuración. Intenta de nuevo.");
  }
  state.admin.savingConfig = false;
  render();
}

async function checkExistingSubmission(cedula){
  try{
    const res = await window.storage.get(buildSubKey(cedula, state.config.cycleId), true);
    if(res && res.value) return JSON.parse(res.value);
    return null;
  }catch(e){
    return null;
  }
}

async function saveSubmission(record){
  await window.storage.set(buildSubKey(record.cedula, record.cycleId), JSON.stringify(record), true);
}

async function loadAllSubmissions(){
  state.admin.loadingRecords = true;
  render();
  let records = [];
  try{
    const list = await window.storage.list(SUB_PREFIX, true);
    const keys = (list && list.keys) ? list.keys : [];
    for(const k of keys){
      try{
        const res = await window.storage.get(k, true);
        if(res && res.value) records.push(JSON.parse(res.value));
      }catch(e){ /* skip */ }
    }
  }catch(e){ /* no records yet */ }
  records.sort((a,b)=> (b.timestamp||0) - (a.timestamp||0));
  state.admin.records = records;
  state.admin.loadingRecords = false;
  render();
}

async function deleteSubmission(cedula, cycleId){
  try{
    await window.storage.delete(buildSubKey(cedula, cycleId), true);
    return true;
  }catch(e){
    return false;
  }
}

/* ===================== LÓGICA DE NEGOCIO ===================== */
function validateForm(){
  const errs = {};
  const w = state.worker;
  if(!w.nombres.trim()) errs.nombres = "Ingresa el nombre completo.";
  if(!w.cedula.trim() || w.cedula.trim().length<5) errs.cedula = "Ingresa un número de cédula válido.";
  if(!w.cargo.trim()) errs.cargo = "Ingresa el cargo.";
  if(!w.parroquia.trim()) errs.parroquia = "Ingresa la parroquia.";
  if(!w.consent) errs.consent = "Debes autorizar el tratamiento de tus datos personales para continuar.";
  state.formErrors = errs;
  return Object.keys(errs).length===0;
}

function validateQuiz(){
  const missing = [];
  QUESTIONS.forEach(q=>{ if(state.answers[q.id]===undefined) missing.push(q.id); });
  MATCH_PAIRS.forEach(m=>{ if(!state.matchAnswers[m.id]) missing.push(m.id); });
  state.quizErrors = missing;
  return missing.length===0;
}

function computeScore(){
  let score = 0;
  const detail = [];
  QUESTIONS.forEach(q=>{
    const chosen = state.answers[q.id];
    const isCorrect = chosen === q.correct;
    if(isCorrect) score++;
    detail.push({id:q.id, text:q.text, chosenText:q.options[chosen], correctText:q.options[q.correct], isCorrect});
  });
  MATCH_PAIRS.forEach(m=>{
    const chosenRiesgoId = state.matchAnswers[m.id];
    const isCorrect = chosenRiesgoId === m.id;
    if(isCorrect) score++;
    const chosenPair = MATCH_PAIRS.find(p=>p.id===chosenRiesgoId);
    detail.push({id:m.id, text:"Emparejar: "+m.peligro, chosenText: chosenPair? chosenPair.riesgo : "(sin respuesta)", correctText:m.riesgo, isCorrect});
  });
  return {score, detail};
}

async function submitQuiz(){
  if(!validateQuiz()){ render(); return; }
  state.submitting = true;
  render();
  const {score, detail} = computeScore();
  const percent = Math.round((score/TOTAL_POINTS)*100);
  const passed = percent >= (state.config.passPercent||70);
  const record = {
    nombres: state.worker.nombres.trim(),
    cedula: state.worker.cedula.trim(),
    cargo: state.worker.cargo.trim(),
    parroquia: state.worker.parroquia.trim(),
    timestamp: Date.now(),
    fecha: new Date().toLocaleString('es-CO'),
    score, totalPoints: TOTAL_POINTS, percent, passed,
    detail,
    cycleId: state.config.cycleId || currentYear(),
    consentimientoDatos: true,
    consentimientoFecha: new Date().toLocaleString('es-CO')
  };
  try{
    await saveSubmission(record);
    state.resultRecord = record;
    state.view = "result";
  }catch(e){
    alert("No se pudo guardar tu evaluación. Verifica tu conexión e intenta de nuevo.");
  }
  state.submitting = false;
  render();
}

/* ===================== EXPORTACIÓN ===================== */
function buildDetailCardHTML(record){
  const statusColor = record.passed ? '#155C45' : '#C0392B';
  const statusBg = record.passed ? '#E7F4EE' : '#FBEAE8';
  let rows = record.detail.map((d,i)=>`
    <div style="padding:10px 0;border-top:${i===0?'none':'1px dashed #DCE4E2'};">
      <div style="font-weight:700;font-size:13px;color:#12303F;margin-bottom:4px;">${i+1}. ${escapeHtml(d.text)}</div>
      <div style="font-size:12.5px;color:${d.isCorrect?'#155C45':'#C0392B'};font-weight:700;">Respuesta: ${escapeHtml(d.chosenText)} ${d.isCorrect?'✓':'✗'}</div>
      ${!d.isCorrect?`<div style="font-size:12px;color:#5B6E75;">Correcta: ${escapeHtml(d.correctText)}</div>`:''}
    </div>
  `).join("");
  return `
    <div style="font-family:'Manrope',system-ui,sans-serif;color:#16262D;">
      <div style="font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:20px;color:#0B222D;margin-bottom:4px;">Evaluación SGSST — Inducción</div>
      <div style="font-size:12px;color:#5B6E75;margin-bottom:18px;">Evidencia de evaluación de conocimiento</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;font-size:13px;">
        <div><b>Nombres:</b> ${escapeHtml(record.nombres)}</div>
        <div><b>Cédula:</b> ${escapeHtml(record.cedula)}</div>
        <div><b>Cargo:</b> ${escapeHtml(record.cargo)}</div>
        <div><b>Parroquia:</b> ${escapeHtml(record.parroquia)}</div>
        <div><b>Fecha:</b> ${escapeHtml(record.fecha)}</div>
        <div><b>Puntaje:</b> ${record.score}/${record.totalPoints} (${record.percent}%)</div>
        <div><b>Ciclo de vigencia:</b> ${escapeHtml(record.cycleId||'—')}</div>
        <div><b>Autorización datos:</b> ${record.consentimientoDatos? 'Sí, Ley 1581 de 2012':'—'}</div>
      </div>
      <div style="display:inline-block;padding:6px 16px;border-radius:99px;font-weight:800;font-size:13px;background:${statusBg};color:${statusColor};margin-bottom:18px;">
        ${record.passed? 'APROBADO' : 'NO APROBADO'}
      </div>
      <div>${rows}</div>
    </div>
  `;
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function exportRecordAsImage(record){
  const holder = document.getElementById('printCard');
  holder.innerHTML = buildDetailCardHTML(record);
  await new Promise(r=>setTimeout(r,60));
  const canvas = await html2canvas(holder, {scale:2, backgroundColor:'#ffffff'});
  const link = document.createElement('a');
  link.download = `evaluacion_${sanitizeKey(record.cedula)}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  holder.innerHTML = '';
}

async function exportRecordAsPDF(record){
  const holder = document.getElementById('printCard');
  holder.innerHTML = buildDetailCardHTML(record);
  await new Promise(r=>setTimeout(r,60));
  const canvas = await html2canvas(holder, {scale:2, backgroundColor:'#ffffff'});
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','pt','a4');
  const pageWidth = pdf.internal.pageSize.getWidth();
  const imgWidth = pageWidth - 60;
  const imgHeight = canvas.height * (imgWidth/canvas.width);
  pdf.addImage(imgData, 'PNG', 30, 30, imgWidth, imgHeight);
  pdf.save(`evaluacion_${sanitizeKey(record.cedula)}.pdf`);
  holder.innerHTML = '';
}

function exportAllExcel(records){
  const resumen = records.map(r=>({
    "Nombres": r.nombres,
    "Cédula": r.cedula,
    "Cargo": r.cargo,
    "Parroquia": r.parroquia,
    "Fecha": r.fecha,
    "Puntaje": r.score,
    "Total puntos": r.totalPoints,
    "Porcentaje": r.percent+"%",
    "Estado": r.passed? "Aprobado":"No aprobado",
    "Ciclo de vigencia": r.cycleId || "",
    "Autorización datos (Ley 1581/2012)": r.consentimientoDatos? "Sí":"No"
  }));
  const detalle = [];
  records.forEach(r=>{
    r.detail.forEach((d,i)=>{
      detalle.push({
        "Cédula": r.cedula,
        "Nombres": r.nombres,
        "Pregunta #": i+1,
        "Pregunta": d.text,
        "Respuesta dada": d.chosenText,
        "Respuesta correcta": d.correctText,
        "¿Correcta?": d.isCorrect? "Sí":"No"
      });
    });
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumen), "Resumen");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detalle), "Detalle_Respuestas");
  XLSX.writeFile(wb, `evaluaciones_SGSST_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function renderQuiz(){
  const c = document.createElement('div');
  const card = document.createElement('div');
  card.className='card';

  const answeredCount = QUESTIONS.filter(q=>state.answers[q.id]!==undefined).length + MATCH_PAIRS.filter(m=>state.matchAnswers[m.id]).length;
  const totalItems = QUESTIONS.length + MATCH_PAIRS.length;
  const pct = Math.round((answeredCount/totalItems)*100);

  const progWrap = document.createElement('div');
  progWrap.className='progress-wrap';
  progWrap.innerHTML = `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-text">${answeredCount} de ${totalItems} respondidas</div>`;
  card.appendChild(progWrap);

  QUESTIONS.forEach((q, idx)=>{
    const block = document.createElement('div');
    block.className='q-block';
    const flagged = state.quizErrors.includes(q.id);
    block.innerHTML = `<div class="q-num">Pregunta ${idx+1}</div><div class="q-text">${escapeHtml(q.text)}</div>`;
    if(flagged){
      const e = document.createElement('div');
      e.className='error-text';
      e.style.margin='0 0 10px';
      e.textContent='Selecciona una opción.';
      block.appendChild(e);
    }
    q.options.forEach((opt, oi)=>{
      const optDiv = document.createElement('div');
      optDiv.className='opt' + (state.answers[q.id]===oi ? ' selected':'');
      optDiv.innerHTML = `<input type="radio" name="${q.id}" ${state.answers[q.id]===oi?'checked':''}/> <span>${escapeHtml(opt)}</span>`;
      optDiv.onclick = ()=>{ state.answers[q.id]=oi; render(); };
      block.appendChild(optDiv);
    });
    card.appendChild(block);
  });

  const matchBlock = document.createElement('div');
  matchBlock.className='q-block';
  matchBlock.innerHTML = `<div class="q-num">Actividad final</div><div class="q-text">Empareja cada peligro con su riesgo asociado</div>`;
  MATCH_PAIRS.forEach(m=>{
    const row = document.createElement('div');
    row.className='match-row';
    const flagged = state.quizErrors.includes(m.id);
    row.innerHTML = `<div class="match-label">${escapeHtml(m.peligro)}</div>`;
    const sel = document.createElement('select');
    sel.className='match-select';
    if(flagged) sel.classList.add('field-error');
    sel.innerHTML = `<option value="">Selecciona el riesgo asociado…</option>` +
      RIESGO_OPTIONS_SHUFFLED.map(r=>`<option value="${r.id}" ${state.matchAnswers[m.id]===r.id?'selected':''}>${escapeHtml(r.riesgo)}</option>`).join('');
    sel.onchange = (e)=>{ state.matchAnswers[m.id]=e.target.value; };
    row.appendChild(sel);
    matchBlock.appendChild(row);
  });
  card.appendChild(matchBlock);

  const submitBtn = document.createElement('button');
  submitBtn.className='btn btn-primary';
  submitBtn.style.marginTop='10px';
  submitBtn.disabled = state.submitting;
  submitBtn.innerHTML = state.submitting ? '<span class="spinner"></span> Enviando...' : 'Enviar evaluación';
  submitBtn.onclick = ()=> submitQuiz();
  card.appendChild(submitBtn);

  c.appendChild(card);
  return c;
}

    viewBtn.textContent = state.admin.expandedRow===r.cedula ? 'Ocultar' : 'Ver';
    viewBtn.onclick = ()=>{ state.admin.expandedRow = state.admin.expandedRow===r.cedula? null : r.cedula; renderAdminTableOnly(); };
    rowActions.appendChild(viewBtn);

    const imgBtn = document.createElement('button');
    imgBtn.className='btn btn-secondary btn-small';
    imgBtn.textContent='Imagen';
    imgBtn.onclick = ()=> exportRecordAsImage(r);
    rowActions.appendChild(imgBtn);

    const pdfBtn = document.createElement('button');
    pdfBtn.className='btn btn-secondary btn-small';
    pdfBtn.textContent='PDF';
    pdfBtn.onclick = ()=> exportRecordAsPDF(r);
    rowActions.appendChild(pdfBtn);

    const resetBtn = document.createElement('button');
    resetBtn.className='btn btn-secondary btn-small';
    resetBtn.textContent='Habilitar reintento';
    resetBtn.onclick = async ()=>{
      if(confirm(`¿Eliminar el registro de ${r.nombres} (ciclo ${r.cycleId||currentYear()}) para permitirle presentar de nuevo?`)){
        await deleteSubmission(r.cedula, r.cycleId);
        loadAllSubmissions();
      }
    };
    rowActions.appendChild(resetBtn);

    actionsTd.appendChild(rowActions);
    tr.appendChild(actionsTd);
    tbody.appendChild(tr);

    if(state.admin.expandedRow===r.cedula){
      const detailTr = document.createElement('tr');
      detailTr.className='detail-row';
      const detailTd = document.createElement('td');
      detailTd.colSpan = 9;
      detailTd.innerHTML = r.detail.map((d,i)=>`
        <div class="detail-q"><b>${i+1}. ${escapeHtml(d.text)}</b><br>
        Respuesta: <span class="${d.isCorrect?'tag-correct':'tag-wrong'}">${escapeHtml(d.chosenText)} ${d.isCorrect?'✓':'✗'}</span>
        ${!d.isCorrect? `<br>Correcta: ${escapeHtml(d.correctText)}`:''}</div>
      `).join('');
      detailTr.appendChild(detailTd);
      tbody.appendChild(detailTr);
    }
  });
  table.appendChild(tbody);
  scrollDiv.appendChild(table);
  holder.innerHTML='';
  holder.appendChild(scrollDiv);
}

function renderAdminTableOnly(){
  const holder = document.getElementById('admin-table-holder');
  if(holder) renderTableInto(holder);
}

function renderAdminConfig(){
  const wrap = document.createElement('div');
  wrap.innerHTML = `<p class="lead">Configura el enlace del video, el porcentaje mínimo de aprobación, la vigencia/reinducción anual y la lista de trabajadores esperados (opcional, para hacer seguimiento).</p>`;

  const lblCycle = document.createElement('label');
  lblCycle.textContent='Ciclo de vigencia / reinducción (ej. el año: 2026)';
  wrap.appendChild(lblCycle);
  const inpCycle = document.createElement('input');
  inpCycle.type='text';
  inpCycle.placeholder=currentYear();
  inpCycle.value = state.admin.editCycleId;
  inpCycle.oninput = (e)=>{ state.admin.editCycleId = e.target.value; };
  wrap.appendChild(inpCycle);
  const cycleNote = document.createElement('div');
  cycleNote.className='info-box';
  cycleNote.textContent = 'Al cambiar este valor (por ejemplo, de "2026" a "2027") todos los trabajadores podrán presentar la evaluación de nuevo automáticamente, sin borrar el historial de años anteriores — quedará disponible en el panel para consulta y exportación.';
  wrap.appendChild(cycleNote);

  const lblCutoff = document.createElement('label');
  lblCutoff.textContent='Fecha de corte / vigencia (informativa para el trabajador)';
  wrap.appendChild(lblCutoff);
  const inpCutoff = document.createElement('input');
  inpCutoff.type='text';
  inpCutoff.placeholder='Ej: 31 de diciembre de 2026';
  inpCutoff.value = state.admin.editCutoffDate;
  inpCutoff.oninput = (e)=>{ state.admin.editCutoffDate = e.target.value; };
  wrap.appendChild(inpCutoff);

  const lbl1 = document.createElement('label');
  lbl1.textContent='Enlace del video de inducción (YouTube, Drive, etc.)';
  wrap.appendChild(lbl1);
  const inp1 = document.createElement('input');
  inp1.type='text';
  inp1.placeholder='https://...';
  inp1.value = state.admin.editVideoUrl;
  inp1.oninput = (e)=>{ state.admin.editVideoUrl = e.target.value; };
  wrap.appendChild(inp1);

  const lbl2 = document.createElement('label');
  lbl2.textContent='Porcentaje mínimo para aprobar (%)';
  wrap.appendChild(lbl2);
  const inp2 = document.createElement('input');
  inp2.type='number';
  inp2.min=0; inp2.max=100;
  inp2.value = state.admin.editPassPercent;
  inp2.oninput = (e)=>{ state.admin.editPassPercent = Number(e.target.value); };
  wrap.appendChild(inp2);

  const lbl3 = document.createElement('label');
  lbl3.textContent='Lista de trabajadores esperados (uno por línea: cédula, nombre)';
  wrap.appendChild(lbl3);
  const ta = document.createElement('textarea');
  ta.rows = 6;
  ta.placeholder = '1020304050, María Torres\n1030405060, Carlos Pérez';
  ta.value = state.admin.editRoster;
  ta.oninput = (e)=>{ state.admin.editRoster = e.target.value; };
  wrap.appendChild(ta);

  const saveBtn = document.createElement('button');
  saveBtn.className='btn btn-primary';
  saveBtn.disabled = state.admin.savingConfig;
  saveBtn.innerHTML = state.admin.savingConfig? '<span class="spinner"></span> Guardando...' : 'Guardar configuración';
  saveBtn.onclick = ()=> saveConfig({
    videoUrl: state.admin.editVideoUrl.trim(),
    passPercent: state.admin.editPassPercent || 70,
    roster: state.admin.editRoster,
    cycleId: (state.admin.editCycleId||"").trim() || currentYear(),
    cutoffDate: state.admin.editCutoffDate.trim()
  });
  wrap.appendChild(saveBtn);

  const noteBox = document.createElement('div');
  noteBox.className='info-box';
  noteBox.style.marginTop='16px';
  noteBox.innerHTML = 'Comparte este mismo enlace por WhatsApp junto con el video. Cada trabajador abre el enlace desde su celular, ve el video y responde la evaluación; los resultados llegan aquí automáticamente. La contraseña de este panel protege el acceso, pero al ser una aplicación sin servidor propio, trátala como una medida básica y no la compartas.';
  wrap.appendChild(noteBox);

  return wrap;
}

/* ===================== INICIO ===================== */
(async function init(){
  render();
  await loadConfig();
  render();
})();
</script>
</body>
</html>
